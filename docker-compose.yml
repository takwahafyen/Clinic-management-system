version: "3.8"

services:
  # ========================================================
  # 1. Database: MongoDB 6.0
  # ========================================================
  mongo:
    image: mongo:6.0
    container_name: clinic-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # 2. Backend API: Express.js (Node 20 Alpine)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URL=mongodb://mongo:27017/clinic
      - JWT_SECRET=clinic_jwt_secret_production_key_2026
      - PASSCODE=ClinicAdmin2026!
      - CLIENT_URL=http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - clinic-network

  # ========================================================
  # 3. Frontend Client: React SPA served with Nginx Alpine
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5000
    container_name: clinic-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - clinic-network

# ========================================================
# Named Volumes & Networks for Persistent Storage
# ========================================================
volumes:
  mongo-data:
    driver: local

networks:
  clinic-network:
    driver: bridge
