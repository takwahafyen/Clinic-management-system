name: CD — Deploy on merge to main

# Trigger: only after a push lands on main (i.e. a PR is merged)
on:
  push:
    branches: [main]

# Require CI to pass before deploying
# (CI workflow must be named "CI" — matches ci.yml)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Deploy backend to Render via deploy hook
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        # Render provides a deploy hook URL in the dashboard:
        # Service → Settings → Deploy Hooks → Create hook
        # Save it as the secret RENDER_DEPLOY_HOOK_URL in GitHub
        # (Settings → Secrets → Actions → New repository secret)
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ─────────────────────────────────────────────────────────────
  # 2. Deploy frontend to Vercel via Vercel CLI
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy frontend to Vercel
        run: |
          vercel deploy --prod --yes \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
